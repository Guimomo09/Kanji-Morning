<!DOCTYPE html>
<html lang="ja">
<head>
  <script>/* anti-flash theme */(function(){var t=localStorage.getItem('km_theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}());</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>朝の漢字 · Asa no Kanji — Daily Japanese Kanji & Vocabulary</title>
  <meta name="description" content="Learn Japanese kanji and vocabulary every day with spaced repetition. Free daily quiz, JLPT levels N5–N1, and personal word list. Start for free at asanokanji.com." />
  <meta name="keywords" content="japanese kanji, learn japanese, JLPT, vocabulary, spaced repetition, daily kanji, 漢字" />
  <link rel="canonical" href="https://asanokanji.com/" />

  <!-- Open Graph -->
  <meta property="og:title" content="朝の漢字 · Asa no Kanji" />
  <meta property="og:description" content="Learn Japanese kanji and vocabulary every day. Free daily quiz, JLPT N5–N1, spaced repetition." />
  <meta property="og:url" content="https://asanokanji.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image" content="https://asanokanji.com/icons/icon-512.svg" />
  <meta property="og:image:alt" content="Asano Kanji logo" />

  <!-- Structured data: Organization (logo for Google Search) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Asano Kanji",
    "url": "https://asanokanji.com/",
    "logo": "https://asanokanji.com/icons/icon-512.svg"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Asano Kanji",
    "url": "https://asanokanji.com/"
  }
  </script>

  <!--
    Data source: kanjiapi.dev (free, open API, no auth required)
    /v1/kanji/jlpt-{4|3|2|1} → full list of kanji chars per JLPT level
    /v1/kanji/{char}          → meanings, on_readings, kun_readings
    /v1/words/{char}          → example words with readings and glosses
    All responses are cached in localStorage (24-hour TTL).
    Total pool: ~103 N5 + ~170 N4 + ~370 N3 + ~374 N2 + ~1136 N1 = ~2153 kanji
  -->

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#c03a20" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="朝の漢字" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://stats.asanokanji.com" />
  <link rel="preconnect" href="https://client.crisp.chat" />
  <!-- Google Fonts async (non-blocking) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>

  <link rel="stylesheet" href="/src/styles.css" />

  <!-- Firebase SDKs (compat). Firestore loaded lazily after auth. -->
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- Crisp live chat widget -->
  <script>
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "508d392e-da32-4d8c-a22f-21e5f7b81b6f";
    window.$crisp.push(['config', 'locale', 'en']);
    window.CRISP_READY_TRIGGER = function() {
      // On mobile, hide the floating bubble — chat is accessible via the hamburger menu
      if (window.innerWidth <= 640) {
        window.$crisp.push(['do', 'chat:hide']);
        // Re-hide after user closes the chat window
        window.$crisp.push(['on', 'chat:closed', function() {
          window.$crisp.push(['do', 'chat:hide']);
        }]);
      }
    };
    (function () {
      var d = document, s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();
  </script>

  <!-- Umami Analytics (self-hosted, RGPD-friendly, no cookies) -->
  <script defer
    src="https://stats.asanokanji.com/script.js"
    data-website-id="025ad3df-b875-4698-b4b0-3e11d72d238d">
  </script>
</head>
<body>

<header>
  <div class="h-left">
    <div class="h-date"  id="hDate">?</div>
    <div class="h-greet" id="hGreet">?</div>
  </div>
  <div class="h-center">
    <div id="hTitle" style="display:none"></div>
    <div id="hSub"   style="display:none"></div>
    <svg class="h-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" aria-label="朝の漢字">
      <circle fill="#faf7f2" cx="96" cy="96" r="92.15"/>
      <path fill="#c03a20" d="M161.34,30.66c21.68,21.45,32.63,53.55,27.07,83.73-10.55,58.58-74.01,89.55-128.02,67.58C12.16,162.8-11.4,107.81,8.34,59.69,34.4-3.14,113.84-17.03,161.34,30.66h0ZM160.97,31.03C121.17-9.07,52.33-.06,21.69,46.35-2.21,81.31,2.38,129.85,31.85,160.15c48.86,50,129.4,27.19,150.2-38.04,10.28-31.33,2.69-67.75-21.08-91.08h0Z"/>
      <path fill="#c03a20" d="M80.27,48.95c-.02,2.53-1.26,4.5-1.12,7.18.49,9.55,8.05,9.44,13.08,14.87,5.59,6.03,5.53,11.96,1.66,17.71-.85-1.7-.23-3.2-.71-5.16-2.09-8.51-10.06-8.31-15.01-14.08-5.96-6.94-4.13-16.19,2.11-20.52Z"/>
      <path fill="#c03a20" d="M100.28,25.02c-4.32,5.31-6.2,11.31-4.22,18.01,2.73,9.27,12.75,13.88,17.94,21.47,7.21,10.55,2.84,21.46-9.6,24.2-.62-.54.24-.78.56-1.01,21.86-15.92-7.77-26.59-13.02-40.34-3.19-8.35-.52-16.78,6.93-21.73.47-.31.71-.85,1.41-.61Z"/>
      <path fill="#c03a20" d="M154.27,151.13c-5.5-1.02-14.34-1.71-24.27-2.15,30.82-16.57,38.48-52.43,29.53-52.43H32.47c-8.96,0-1.27,35.93,29.63,52.48-10.8.51-22.75,1.33-26.52,2.52-3.52,1.1-.48,1.89,3.03,2.47,2.27.37,5.1.7,8.35,1,.12.97,1.78,1.73,3.62,2.35,17.11,5.7,73.37,5.81,90.44.08,2.3-.77,3.85-1.56,4.01-2.42,3.04-.28,5.7-.6,7.86-.95,5.35-.88,7.53-1.79,1.38-2.94Z"/>
      <path fill="#c03a20" d="M176.92,107.91c-2.36-7.03-7.42-8.47-14.29-7.4-4.3.67-12.57,1.88-14.37,6.44-2.49,6.33-3.91,13.29-5.83,19.82-.47,1.61.58,3.03,2.03,3.58,8.59,3.26,17.46,4.82,25.29-1.12,6.64-5.04,8.95-13.38,7.17-21.32-.82-3.65-6.43-2.11-5.61,1.55,1.45,6.45-1.01,13.01-6.87,16.34s-12.47,1.19-18.42-1.07l2.03,3.58c1.36-4.63,2.72-9.25,4.09-13.88.41-1.38.78-5.2,1.84-6.24s-4.06,2,1.41.24c1.45-.47,2.86-1,4.34-1.38,3.9-1.02,9.88-2.67,11.58,2.41,1.18,3.54,6.81,2.02,5.61-1.55Z"/>
      <text font-family="'Noto Sans JP',sans-serif" font-size="39" font-weight="700" fill="#faf7f2" transform="translate(76.42 137.45)">朝</text>
    </svg>
  </div>
  <div class="h-right">
    <div id="authWrap" class="auth-wrap"></div>
    <!-- Desktop: gear icon -->
    <button class="h-settings-btn" id="settingsBtn" onclick="openSettings()" title="Settings">⚙️</button>
    <!-- Mobile: hamburger menu -->
    <div class="h-hamburger-wrap">
      <button class="h-settings-btn" id="mobileMenuBtn" onclick="openMobileMenu()" title="Menu">☰</button>
      <div id="mobileMenu" class="mobile-menu" style="display:none">
        <button class="mobile-menu-item" id="mobileMenuSettings">⚙️ Settings</button>
        <button class="mobile-menu-item" id="mobileMenuChat">💬 Chat</button>
      </div>
    </div>
  </div>
</header>

<div class="tabbar">
  <button class="tab active" id="tabHome"   onclick="switchTab('home')"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><br><span class="tab-sub" data-i18n="tab_home">Home</span></button>
  <button class="tab"        id="tabKanji"  onclick="switchTab('kanji')">漢<br><span class="tab-sub" data-i18n="tab_kanji">Kanji</span></button>
  <button class="tab"        id="tabVocab"  onclick="switchTab('vocab')">語<br><span class="tab-sub" data-i18n="tab_vocab">Vocab</span></button>
  <button class="tab tab-exam-btn" id="tabExam"   onclick="switchTab('exam')">試験<br><span class="tab-sub">Exam</span></button>
  <button class="tab"        id="tabMyList" onclick="switchTab('mylist')"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><br><span class="tab-sub" data-i18n="tab_mylist">My List</span></button>
  <button class="tab"        id="tabStats"  onclick="switchTab('stats')"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><br><span class="tab-sub" data-i18n="tab_stats">Stats</span></button>
</div>

<div class="toolbar" id="toolbarDiv">
  <button class="btn btn-primary" id="btnRefresh" onclick="refresh()" data-i18n="btn_new_selection">↺ New Selection</button>
  <button class="btn btn-quiz"  id="btnFromKanji"     onclick="toggleFromKanji()"     style="display:none" data-i18n="btn_from_kanji">From Kanji</button>
  <button class="btn btn-save"  id="btnSave"          onclick="saveToday()"           style="display:none" data-i18n="btn_save_quiz">Save for Quiz</button>
  <button class="btn btn-quiz"  id="btnDailyQuiz"     onclick="launchDailyQuiz()"     style="display:none" data-i18n="btn_daily_quiz">試 Daily Quiz</button>
  <button class="btn btn-exam"  id="btnExam"          onclick="launchExamMode()"      style="display:none" data-i18n="btn_exam_mode">試験 Exam Mode</button>
  <button class="btn btn-ghost" id="btnMore"          onclick="changeCount(1)"                             data-i18n="btn_more">＋ More</button>
  <button class="btn btn-ghost" id="btnLess"          onclick="changeCount(-1)"                            data-i18n="btn_less">－ Less</button>
  <button class="btn btn-quiz"  id="btnBiweeklyQuiz"  onclick="launchBiWeeklyQuiz()"  style="display:none" data-i18n="btn_weekly_challenge">Weekly Challenge</button>
  <button class="section-hint-btn" id="btnMyListHint" style="display:none;margin-left:auto" onclick="showTabHint('mylist')" aria-label="How to use My List">i</button>
  <button class="section-hint-btn" id="btnStatsHint"  style="display:none;margin-left:auto" onclick="showTabHint('stats')"  aria-label="How to read Stats">i</button>
  <button class="section-hint-btn" id="levelInfoBtn"  style="display:none;margin-left:auto" aria-label="How to use this tab" onclick="showTabHint(this.dataset.tab)">i</button>
</div>
<div class="level-filter" id="levelFilter" style="display:none">
  <span class="level-filter-label" data-i18n="filter_level">Level:</span>
  <button class="pill active" data-level="all" onclick="setLevel('all')" data-i18n="filter_all">All</button>
  <button class="pill"        data-level="5"   onclick="setLevel('5')">N5</button>
  <button class="pill"        data-level="4"   onclick="setLevel('4')">N4</button>
  <button class="pill"        data-level="3"   onclick="setLevel('3')">N3</button>
  <button class="pill"        data-level="2"   onclick="setLevel('2')">N2</button>
  <button class="pill"        data-level="1"   onclick="setLevel('1')">N1</button>
  <span class="toolbar-info"><span data-i18n="filter_showing">Showing</span> <strong id="countLabel">10</strong> <span id="tabLabel">vocabulary</span></span>
  <span id="statusMsg" class="status-loading">読み込み中…</span>
</div>

<div class="search-wrap" id="searchWrap" style="display:none">
  <input class="search-input" id="searchInput" type="search" placeholder="🔍 Search kanji, reading or meaning…" oninput="filterGrid(this.value)" />
</div>

<div class="home-section"   id="homeSection"></div>
<div class="grid" id="grid" style="display:none">
  <div class="search-no-results" id="searchNoResults" style="display:none" data-i18n="search_no_results">No results found.</div>
</div>
<div class="stats-section"  id="statsSection"  style="display:none"></div>
<div class="mylist-section" id="mylistSection" style="display:none"></div>
<div class="exam-section"   id="examSection"   style="display:none"></div>

<footer><span data-i18n="footer_msg">頑張って！Keep showing up — every morning counts.</span><br><a href="/privacy.html" style="color:var(--muted);font-size:12px;text-decoration:none;border-bottom:1px solid var(--border)" data-i18n="footer_privacy">Privacy Policy</a></footer>

<!-- Tab hint modal (ⓘ per-tab explainer) -->
<div class="tab-hint-backdrop" id="tabHintModal" style="display:none" onclick="closeTabHint()">
  <div class="tab-hint-card" onclick="event.stopPropagation()">
    <button class="tab-hint-close" onclick="closeTabHint()">✕</button>
    <div class="tab-hint-icon" id="tabHintIcon"></div>
    <div class="tab-hint-title" id="tabHintTitle"></div>
    <div class="tab-hint-body" id="tabHintBody"></div>
  </div>
</div>

<!-- Tutorial overlay (shown on first visit) -->
<div class="tutorial-overlay" id="tutorialOverlay" style="display:none">
  <div class="tutorial-card">
    <button class="tutorial-close" onclick="closeTutorial()">✕</button>
    <div class="tutorial-icon" id="tutIcon"></div>
    <div class="tutorial-title" id="tutTitle"></div>
    <div class="tutorial-body" id="tutBody"></div>
    <div class="tutorial-dots" id="tutDots"></div>
    <div class="tutorial-nav">
      <button class="btn btn-ghost" id="tutPrevBtn" onclick="tutorialPrev()" style="display:none">← Back</button>
      <button class="btn btn-primary" id="tutNextBtn" onclick="tutorialNext()">Next →</button>
    </div>
  </div>
</div>

<!-- Settings drawer (slides in from right) -->
<div id="settingsPage">
  <div class="settings-page-header">
    <button class="settings-back-btn" onclick="closeSettings()" data-i18n="settings_back">← Back</button>
    <span class="settings-page-title" data-i18n="settings_title">Settings</span>
  </div>
  <div class="settings-page-body">
    <div class="settings-section-title">Apparence</div>
    <div class="settings-row">
      <label class="settings-label">Thème</label>
      <div class="theme-toggle-group" id="themeToggleGroup">
        <button class="theme-btn" data-val="light" onclick="changeTheme('light')">Light</button>
        <button class="theme-btn" data-val="auto"  onclick="changeTheme('auto')">Auto</button>
        <button class="theme-btn" data-val="dark"  onclick="changeTheme('dark')">Dark</button>
      </div>
    </div>
    <div class="settings-section-title" style="margin-top:20px" data-i18n="settings_language">Language</div>
    <div class="settings-row">
      <select id="langSelect" aria-label="Language" onchange="changeLanguage(this.value)" class="settings-toggle" style="width:auto;padding:4px 8px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="ru">Русский</option>
      </select>
    </div>
    <div class="settings-save-row">
      <button class="btn btn-primary" onclick="saveSettings()" data-i18n="settings_save">Save</button>
      <span class="settings-save-msg" id="settingsSaveMsgMobile"></span>
    </div>
  </div>
</div>

<!-- Kanji detail popup -->
<div class="kanji-detail-backdrop" id="kanjiDetailBackdrop" style="display:none" onclick="closeKanjiDetail()">
  <div class="kanji-detail-modal" onclick="event.stopPropagation()">
    <button class="kanji-detail-close" onclick="closeKanjiDetail()">✕</button>
    <div id="kanjiDetailContent"><div class="kanji-detail-loading">Loading…</div></div>
  </div>
</div>

<!-- Upgrade modal -->
<div class="upgrade-modal-backdrop" id="upgradeModal" style="display:none" onclick="closeUpgradeModal()">
  <div class="upgrade-modal" onclick="event.stopPropagation()">
    <button class="kanji-detail-close" onclick="closeUpgradeModal()">✕</button>
    <div class="upgrade-modal-body"></div>
  </div>
</div>

<!-- Premium success modal -->
<div class="upgrade-modal-backdrop" id="premiumSuccessModal" style="display:none" onclick="this.style.display='none';document.body.style.overflow=''">
  <div class="upgrade-modal" onclick="event.stopPropagation()">
    <button class="kanji-detail-close" onclick="document.getElementById('premiumSuccessModal').style.display='none';document.body.style.overflow=''">✕</button>
    <div style="text-align:center;padding:12px 0">
      <div style="font-size:52px;margin-bottom:12px">🎌</div>
      <div class="upgrade-modal-title" data-i18n="premium_welcome">Welcome to Premium!</div>
      <div class="psm-status" style="font-size:15px;color:var(--sub);margin:12px 0" data-i18n="premium_activated">🎉 Premium activated!</div>
      <div style="font-size:14px;color:var(--muted)" data-i18n-html="premium_msg">Your word list is now unlimited.<br>Exam Mode and full stats are unlocked.</div>
      <button class="btn btn-primary" style="margin-top:20px" onclick="document.getElementById('premiumSuccessModal').style.display='none';document.body.style.overflow=''" data-i18n="premium_lets_go">Let's go! →</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
