<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 160px;
    font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
  }
  .hook {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .can-you {
    font-size: 54px;
    font-weight: 700;
    color: #222;
    letter-spacing: 2px;
  }
  .read-this {
    font-size: 72px;
    font-weight: 900;
    color: #c0392b;
    letter-spacing: 3px;
  }
  .arrow {
    font-size: 48px;
    color: #c0392b;
    margin-top: 8px;
    animation: none;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="hook">
    <div class="can-you">Can you read this?</div>
    <div class="arrow">↑</div>
  </div>
</body>
</html>
